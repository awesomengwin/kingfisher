<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>user saved tracks</title>
</head>
<body>
<th:block th:fragment="content">
    <aside class="left-sidebar d-flex flex-column" data-user-saved-tracks>
        <div class="flex-grow-1 list-group overflow-auto">
            <button th:each="track: ${userSavedTracks.items()}"
                    class="list-group-item list-group-item-action"
                    hx-put="/spotify/player/play" hx-trigger="dblclick"
                    th:hx-vals='|js:{uri: "${track.track().uri()}", deviceId: document.body.dataset.deviceId}|'
                    hx-swap="none" th:text="${track.track().name()}">
            </button>
        </div>
        <th:block th:replace="~{fragments/pagination :: pagination(
            name='User saved tracks',
            currentPage=${userSavedTracks.currentPage()},
            totalPages=${userSavedTracks.totalPages()},
            limit=${userSavedTracks.limit()})}"/>
    </aside>
    <section class="flex-grow-1 overflow-auto">
        blank
    </section>
</th:block>
</body>
</html>
