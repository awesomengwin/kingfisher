<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title/text()}, ~{::content})}">
<head>
    <title>user saved tracks</title>
</head>
<body>
<th:block th:fragment="content">
    <aside class="left-sidebar d-flex flex-grow-1 flex-lg-grow-0 flex-column" data-user-saved-tracks>
        <div class="flex-grow-1 list-group overflow-auto">
            <button th:each="track: ${userSavedTracks.items()}"
                    class="list-group-item list-group-item-action"
                    hx-put="/player/play" hx-trigger="dblclick"
                    th:hx-vals='|js:{
                        deviceId: document.body.dataset.deviceId,
                        uri: "${track.track().uri()}"
                    }|'
                    hx-swap="none" th:text="${track.track().name()}">
            </button>
        </div>
        <th:block th:replace="~{fragments/pagination :: pagination(
            name='User saved tracks',
            page=${userSavedTracks.page()},
            size=${userSavedTracks.size()},
            totalPages=${userSavedTracks.totalPages()})}"/>
    </aside>
    <section class="d-none d-lg-block flex-grow-1 overflow-auto">
        blank
    </section>
</th:block>
</body>
</html>
