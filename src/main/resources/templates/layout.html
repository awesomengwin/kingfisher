<!--/*@thymesVar id="currentPage" type="java.lang.String"*/-->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width; initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:replace="${title}"></title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/webjars/htmx.org/4.0.0/dist/htmx.min.js}"></script>
    <script type="module" th:src="@{/js/app.js}"></script>
</head>
<body hx-boost:inherited="true" class="d-flex flex-column vh-100">
<!--Header-->
<header class="flex-shrink-0 mb-3 bg-body-tertiary">
    <div class="container">
        <nav hx-target:inherited="main" hx-select:inherited="main" hx-swap:inherited="outerHTML"
             class="navbar navbar-expand-lg">
            <a th:href="@{/}" class="navbar-brand">kingfisher</a>
            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarToggle"
                    aria-controls="navbarToggle" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarToggle">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a th:href="@{/library/tracks}" class="nav-link"
                           th:classappend="${currentPage eq '/library/tracks' ? 'active' : ''}"
                           th:attr="aria-current=${currentPage eq '/library/tracks' ? 'page' : ''}">Liked tracks</a>
                    </li>
                    <li class="nav-item">
                        <a th:href="@{/library/playlists}" class="nav-link"
                           th:classappend="${currentPage eq '/library/playlists' ? 'active' : ''}"
                           th:attr="aria-current=${currentPage eq '/library/playlists' ? 'page' : ''}">Playlists</a>
                    </li>
                </ul>
            </div>
        </nav>
    </div>
</header>
<!--Popup-->
<div class="container">
    <div data-popup-success class="alert alert-success d-none" role="alert">
        A simple success alert—check it out!
    </div>
    <div data-popup-error class="alert alert-danger d-none" role="alert">
        A simple danger alert—check it out!
    </div>
</div>
<div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
<!--Main-->
<main hx-history-elt class="container d-flex flex-grow-1 gap-3 mb-3">
    <th:block th:replace="${content}"/>
</main>
<!--Playing Bar-->
<div data-playing-bar class="container d-flex align-items-center gap-3 flex-shrink-0">
    <img data-track-album-cover class="flex-shrink-0 d-none d-lg-block"
         src="https://i.scdn.co/image/ab67616d0000b27390a50cfe99a4c19ff3cbfbdb"
         alt="Track cover art" width="64" height="64">
    <img data-track-album-cover class="flex-shrink-0 d-block d-lg-none"
         src="https://i.scdn.co/image/ab67616d0000b27390a50cfe99a4c19ff3cbfbdb"
         alt="Track cover art" width="100" height="100">
    <div class="d-flex flex-column flex-grow-1" style="min-width: 0">
        <div class="d-flex flex-column flex-lg-row align-items-start align-items-lg-center justify-content-center justify-content-lg-between">
            <div class="d-flex flex-column align-self-stretch align-self-lg-auto" style="min-width: 0">
                <div data-track-name class="text-truncate lead">
                    Since I've Been Loving You
                </div>
                <div data-track-artists class="text-truncate text-body-secondary small">
                    Led Zeppelin
                </div>
            </div>
            <div class="d-flex align-items-center gap-1">
                <button data-lyrics-toggle disabled class="btn btn-outline-secondary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-mic-vocal"><path d="m11 7.601-5.994 8.19a1 1 0 0 0 .1 1.298l.817.818a1 1 0 0 0 1.314.087L15.09 12"/><path d="M16.5 21.174C15.5 20.5 14.372 20 13 20c-2.058 0-3.928 2.356-6 2-2.072-.356-2.775-3.369-1.5-4.5"/><circle cx="16" cy="7" r="5"/></svg>
                </button>
                <button data-player-shuffle class="btn btn-outline-secondary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shuffle"><path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22"/><path d="M2 6h1.972a4 4 0 0 1 3.6 2.2"/><path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45"/></svg>
                </button>
                <button data-player-repeat class="btn btn-outline-secondary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-repeat-off"><path d="M11.656 6H21l-4-4"/><path d="M17.898 17.898A4 4 0 0 1 17 18H3l4-4"/><path d="m2 2 20 20"/><path d="M21 13v1a4 4 0 0 1-.171 1.159"/><path d="m21 6-4 4"/><path d="M3 11v-1a4 4 0 0 1 3.102-3.898"/><path d="m7 22-4-4"/></svg>
                </button>
                <button data-player-prev class="btn btn-outline-secondary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-skip-back"><path d="M17.971 4.285A2 2 0 0 1 21 6v12a2 2 0 0 1-3.029 1.715l-9.997-5.998a2 2 0 0 1-.003-3.432z"/><path d="M3 20V4"/></svg>
                </button>
                <button data-player-toggle class="btn btn-outline-secondary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-play"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg>
                </button>
                <button data-player-next class="btn btn-outline-secondary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-skip-forward"><path d="M21 4v16"/><path d="M6.029 4.285A2 2 0 0 0 3 6v12a2 2 0 0 0 3.029 1.715l9.997-5.998a2 2 0 0 0 .003-3.432z"/></svg>
                </button>
            </div>
        </div>
        <div class="d-flex align-items-center gap-2 w-100">
            <small data-position class="flex-shrink-0">1:32</small>
            <input data-progress type="range" min="0" max="0" value="0" step="1"
                   class="form-range flex-grow-1" aria-label="Track name progress">
            <small data-duration class="flex-shrink-0">1:32</small>
        </div>
    </div>
</div>
</body>
</html>
