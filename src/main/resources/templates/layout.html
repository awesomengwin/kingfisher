<!--/*@thymesVar id="currentPage" type="java.lang.String"*/-->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width; initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:replace="${title}"></title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/webjars/htmx.org/2.0.10/dist/htmx.min.js}"></script>
    <script type="module" th:src="@{/js/app.js}"></script>
</head>
<body class="d-flex flex-column vh-100" data-hx-boost="true" data-hx-target="main" data-hx-select="main">
<header class="flex-shrink-0 mb-3 bg-body-tertiary">
    <div class="container">
        <nav class="navbar navbar-expand-lg">
            <a th:href="@{/}" class="navbar-brand">kingfisher</a>
            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarToggle"
                    aria-controls="navbarToggle" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarToggle">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a th:href="@{/library/tracks}" class="nav-link"
                           th:classappend="${currentPage eq '/library/tracks' ? 'active' : ''}"
                           th:attr="aria-current=${currentPage eq '/library/tracks' ? 'page' : ''}">Liked tracks</a>
                    </li>
                </ul>
            </div>
        </nav>
    </div>
</header>
<main class="container d-flex flex-grow-1 gap-3">
    <th:block th:replace="${content}"/>
</main>
<div data-playing-bar class="container d-flex align-items-center gap-3 flex-shrink-0" data-hx-disinherit="hx-target hx-select">
    <img data-track-album-cover class="flex-shrink-0"
         src="https://i.scdn.co/image/ab67616d0000b27390a50cfe99a4c19ff3cbfbdb"
         alt="Track cover art" width="64" height="64">
    <div class="d-flex flex-column flex-grow-1" style="min-width: 0">
        <div class="d-flex align-items-center justify-content-between">
            <div class="d-flex flex-column" style="min-width: 0">
                <div data-track-name class="text-truncate lead">
                    Since I've Been Loving You
                </div>
                <div data-track-artists class="text-truncate text-body-secondary small">
                    Led Zeppelin
                </div>
            </div>
            <button data-player-toggle class="btn btn-link p-0">
                <svg data-play-icon xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-play-circle-fill" viewBox="0 0 16 16">
                    <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M6.79 5.093A.5.5 0 0 0 6 5.5v5a.5.5 0 0 0 .79.407l3.5-2.5a.5.5 0 0 0 0-.814z"/>
                </svg>
                <svg data-pause-icon xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-pause-circle-fill d-none" viewBox="0 0 16 16">
                    <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M6.25 5C5.56 5 5 5.56 5 6.25v3.5a1.25 1.25 0 1 0 2.5 0v-3.5C7.5 5.56 6.94 5 6.25 5m3.5 0c-.69 0-1.25.56-1.25 1.25v3.5a1.25 1.25 0 1 0 2.5 0v-3.5C11 5.56 10.44 5 9.75 5"/>
                </svg>
            </button>
        </div>
        <div class="d-flex align-items-center gap-2 w-100">
            <small data-position class="flex-shrink-0">1:32</small>
            <input data-progress type="range" min="0" max="0" value="0" step="1"
                   class="form-range flex-grow-1" aria-label="Track name progress">
            <small data-duration class="flex-shrink-0">1:32</small>
        </div>
    </div>
</div>
</body>
</html>
