<!--/*@thymesVar id="currentPage" type="java.lang.String"*/-->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width; initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title><th:block th:insert="${title}"/> - Kingfisher</title>
    <link rel="stylesheet" th:href="@{/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script type="module" th:src="@{/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/webjars/htmx.org/4.0.0/dist/htmx.min.js}"></script>
    <script type="module" th:src="@{/js/app.js}"></script>
</head>
<body hx-boost:inherited="true" hx-indicator:inherited="#app-spinner" class="d-flex flex-column vh-100">
<!--Header-->
<header id="header" hx-swap-oob="true" class="flex-shrink-0 mb-5 bg-1">
    <div class="container py-5">
        <ul hx-target:inherited="main" hx-select:inherited="main" hx-swap:inherited="outerHTML"
            class="nav nav-underline">
            <li class="nav-item">
                <a th:href="@{/}" class="nav-link"
                   th:classappend="${currentPage eq '/' ? 'active' : ''}"
                   th:attr="aria-current=${currentPage eq '/' ? 'page' : ''}">Home</a>
            </li>
            <li class="nav-item">
                <a th:href="@{/library/tracks}" class="nav-link"
                   th:classappend="${currentPage eq '/library/tracks' ? 'active' : ''}"
                   th:attr="aria-current=${currentPage eq '/library/tracks' ? 'page' : ''}">Liked tracks</a>
            </li>
            <li class="nav-item">
                <a th:href="@{/library/playlists}" class="nav-link"
                   th:classappend="${currentPage eq '/library/playlists' ? 'active' : ''}"
                   th:attr="aria-current=${currentPage eq '/library/playlists' ? 'page' : ''}">Playlists</a>
            </li>
            <li class="nav-item">
                <a th:href="@{/me/preferences}" class="nav-link"
                   th:classappend="${currentPage eq '/me/preferences' ? 'active' : ''}"
                   th:attr="aria-current=${currentPage eq '/me/preferences' ? 'page' : ''}">User Preferences</a>
            </li>
        </ul>
    </div>
</header>
<div id="app-toast" class="toast-container position-fixed bottom-0 end-0 p-5"></div>
<div id="app-spinner" class="htmx-indicator position-fixed w-100 h-100 z-3 top-0 d-flex align-items-center">
    <div class="mx-auto spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>
<!--Main-->
<main hx-history-elt class="container d-flex flex-grow-1 gap-5 mb-5">
    <th:block th:replace="${content}"/>
</main>
<div id="translation" class="container"></div>
<div id="analysis" class="container"></div>
<!--Playback State-->
<div data-playback-state class="container mb-5">
    <button data-playback-toggle class="form-control combobox-toggle" type="button"
            data-bs-toggle="combobox"
            data-bs-name="Playback State"
            data-bs-placeholder="Transfer playback">
        <span class="combobox-value">Transfer playback</span>
        <svg class="combobox-caret" width="10" height="16" viewBox="0 0 10 16" fill="none"
             xmlns="http://www.w3.org/2000/svg">
            <path d="M0.46967 5.46967C0.762563 5.17678 1.23744 5.17678 1.53033 5.46967L5 8.93934L8.46967 5.46967C8.76256 5.17678 9.23744 5.17678 9.53033 5.46967C9.82322 5.76256 9.82322 6.23744 9.53033 6.53033L5.53033 10.5303C5.23744 10.8232 4.76256 10.8232 4.46967 10.5303L0.46967 6.53033C0.176777 6.23744 0.176777 5.76256 0.46967 5.46967Z"
                  fill="currentcolor"/>
        </svg>
    </button>
    <div data-available-devices class="menu"></div>
</div>
<!--Playing Bar-->
<div data-playing-bar class="container d-flex flex-column flex-shrink-0">
    <div class="d-flex flex-column md:flex-row gap-3 justify-content-between flex-column-reverse" style="min-width: 0">
        <!--Artwork, name, artists-->
        <div class="d-flex gap-3 align-items-center" style="min-width: 0">
            <img data-track-album-cover
                 src="https://i.scdn.co/image/ab67616d0000b27390a50cfe99a4c19ff3cbfbdb"
                 alt="Since I've Been Loving You" width="64" height="64">
            <div class="d-flex flex-column align-self-stretch" style="min-width: 0">
                <div data-track-name class="text-truncate fs-lg fw-light">
                    Since I've Been Loving You
                </div>
                <div data-track-artists class="text-truncate fg-3 small">
                    Led Zeppelin
                </div>
            </div>
        </div>
        <!--Controls-->
        <div class="d-flex align-items-center gap-1">
            <button data-analyze-lyrics disabled class="btn-icon btn-solid btn-styled theme-secondary">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     class="lucide lucide-sparkles preview-icon">
                    <path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/>
                    <path d="M20 2v4"/>
                    <path d="M22 4h-4"/>
                    <circle cx="4" cy="20" r="2"/>
                </svg>
            </button>
            <button data-translate-lyrics disabled class="btn-icon btn-solid btn-styled theme-secondary">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     class="lucide lucide-languages preview-icon">
                    <path d="m5 8 6 6"/>
                    <path d="m4 14 6-6 2-3"/>
                    <path d="M2 5h12"/>
                    <path d="M7 2h1"/>
                    <path d="m22 22-5-10-5 10"/>
                    <path d="M14 18h6"/>
                </svg>
            </button>
            <button data-lyrics-toggle disabled class="btn-icon btn-solid btn-styled theme-secondary">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     class="lucide lucide-mic-vocal">
                    <path d="m11 7.601-5.994 8.19a1 1 0 0 0 .1 1.298l.817.818a1 1 0 0 0 1.314.087L15.09 12"/>
                    <path d="M16.5 21.174C15.5 20.5 14.372 20 13 20c-2.058 0-3.928 2.356-6 2-2.072-.356-2.775-3.369-1.5-4.5"/>
                    <circle cx="16" cy="7" r="5"/>
                </svg>
            </button>
            <button data-player-shuffle class="btn-icon btn-solid btn-styled theme-secondary">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     class="lucide lucide-shuffle">
                    <path d="m18 14 4 4-4 4"/>
                    <path d="m18 2 4 4-4 4"/>
                    <path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22"/>
                    <path d="M2 6h1.972a4 4 0 0 1 3.6 2.2"/>
                    <path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45"/>
                </svg>
            </button>
            <button data-player-repeat class="btn-icon btn-solid btn-styled theme-secondary">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     class="lucide lucide-repeat-off">
                    <path d="M11.656 6H21l-4-4"/>
                    <path d="M17.898 17.898A4 4 0 0 1 17 18H3l4-4"/>
                    <path d="m2 2 20 20"/>
                    <path d="M21 13v1a4 4 0 0 1-.171 1.159"/>
                    <path d="m21 6-4 4"/>
                    <path d="M3 11v-1a4 4 0 0 1 3.102-3.898"/>
                    <path d="m7 22-4-4"/>
                </svg>
            </button>
            <button data-player-prev class="btn-icon btn-solid btn-styled theme-secondary">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     class="lucide lucide-skip-back">
                    <path d="M17.971 4.285A2 2 0 0 1 21 6v12a2 2 0 0 1-3.029 1.715l-9.997-5.998a2 2 0 0 1-.003-3.432z"/>
                    <path d="M3 20V4"/>
                </svg>
            </button>
            <button data-player-toggle class="btn-icon btn-solid btn-styled theme-secondary">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     class="lucide lucide-play">
                    <path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/>
                </svg>
            </button>
            <button data-player-next class="btn-icon btn-solid btn-styled theme-secondary">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     class="lucide lucide-skip-forward">
                    <path d="M21 4v16"/>
                    <path d="M6.029 4.285A2 2 0 0 0 3 6v12a2 2 0 0 0 3.029 1.715l9.997-5.998a2 2 0 0 0 .003-3.432z"/>
                </svg>
            </button>
        </div>
    </div>
    <div class="form-range d-flex align-items-center gap-3 w-100">
        <small data-position class="flex-shrink-0">1:32</small>
        <input data-progress type="range" min="0" max="0" value="0" step="1"
               class="form-range-input flex-grow-1" aria-label="Track name progress">
        <small data-duration class="flex-shrink-0">1:32</small>
    </div>
</div>
</body>
</html>
