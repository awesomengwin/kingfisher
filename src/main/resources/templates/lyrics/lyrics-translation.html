<!--/*@thymesVar id="trackId" type="java.lang.String"*/-->
<!--/*@thymesVar id="isCompleted" type="java.lang.Boolean"*/-->
<th:block th:if="${!isCompleted}">
    <hx-partial hx-target="#translation">
        <div th:hx-get="@{/lyrics/translation(trackId=${trackId})}" hx-trigger="every 2s" hx-indicator="#translation">
            <div class="d-flex align-items-center gap-2 mt-3">
                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                <span>Translating...</span>
            </div>
        </div>
    </hx-partial>
</th:block>
