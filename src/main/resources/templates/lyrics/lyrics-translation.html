<hx-partial hx-target="#translation">
    <div th:hx-get="@{/lyrics/translation(trackId=${trackId})}" hx-trigger="every 5s"></div>
    <div class="d-flex gap-2 align-items-center">
        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
        <span>Translating...</span>
    </div>
</hx-partial>

<th:block th:if="${isCompleted}">
    <div th:replace="~{fragments/toast :: toast(title='Translation completed!', message='')}"></div>
    <hx-partial hx-target="#translation"></hx-partial>
</th:block>

<th:block th:if="${isFailed}">
    <div th:replace="~{fragments/toast :: toast(title='Translation failed!', message=${failureReason})}"></div>
    <hx-partial hx-target="#translation"></hx-partial>
</th:block>
