<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title/text()}, ~{::content})}">
<head>
    <title>lyrics</title>
</head>
<body>
<th:block th:fragment="content">
    <div class="w-100 d-flex flex-column gap-5">
        <div class="flex-grow-1 overflow-y-auto" data-lyrics>
            <th:block th:if="${#lists.isEmpty(lyrics.lines())}">
                <p class="fs-3xl">No lyrics available.</p>
            </th:block>
            <th:block th:unless="${#lists.isEmpty(lyrics.lines())}">
                <div th:each="line : ${lyrics.lines()}" class="opacity-25 mb-7" data-lyrics-line
                     th:data-start-time-ms="${line.startTimeMs}"
                     th:data-annotation-id="${line.annotationFromTimeMs}"
                     th:data-annotation-body="${line.annotationBody}"
                     th:role="${line.annotationFromTimeMs != null} ? 'button'">
                    <p class="text-break fs-4xl fw-bold m-0" th:classappend="${line.annotationFromTimeMs} ? 'text-decoration-underline'" th:text="${line.words}"></p>
                    <p class="text-break fs-2xl fw-normal m-0 opacity-75"
                       th:if="${line.translatedWords()}" th:text="${line.translatedWords()}"></p>
                </div>
            </th:block>
        </div>
    </div>
</th:block>
</body>
