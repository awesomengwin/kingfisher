<hx-partial hx-target="#analysis">
    <div th:hx-get="@{/lyrics/analysis(trackId=${trackId})}" hx-trigger="every 5s" hx-indicator="#analysis"></div>
    <div class="d-flex gap-2 align-items-center py-2">
        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
        <span>Analyzing...</span>
    </div>
</hx-partial>

<th:block th:if="${isCompleted}">
    <div th:replace="~{fragments/toast :: toast(message='Analysis completed!', title='Kingfisher')}"></div>
    <hx-partial hx-target="#analysis"></hx-partial>
</th:block>

<th:block th:if="${isFailed}">
    <div th:replace="~{fragments/toast :: toast(message=${failureReason}, title='Kingfisher')}"></div>
    <hx-partial hx-target="#analysis"></hx-partial>
</th:block>
