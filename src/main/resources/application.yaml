server:
  forward-headers-strategy: framework

spring:
  application:
    name: kingfisher
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kingfisher}
    username: ${DB_USERNAME:kingfisher}
    password: ${DB_PASSWORD:kingfisher}
  jpa:
    hibernate:
      ddl-auto: none
  security:
    oauth2:
      client:
        provider:
          spotify:
            authorization-uri: https://accounts.spotify.com/authorize
            token-uri: https://accounts.spotify.com/api/token
            user-info-uri: https://api.spotify.com/v1/me
            user-name-attribute: account_id
        registration:
          spotify-login:
            provider: spotify
            client-id: ${SPOTIFY_CLIENT_ID:your_spotify_client_id}
            client-secret: ${SPOTIFY_CLIENT_SECRET:your_spotify_client_secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/spotify-login"
            scope:
              - user-read-private
              - user-read-email
              - user-library-read
              - playlist-read-private
              - user-modify-playback-state
              - streaming
          spotify-service:
            provider: spotify
            client-id: ${SPOTIFY_CLIENT_ID:your_spotify_client_id}
            client-secret: ${SPOTIFY_CLIENT_SECRET:your_spotify_client_secret}
            authorization-grant-type: client_credentials
  http:
    serviceclient:
      spotify:
        base-url: https://api.spotify.com/v1
      lyrics:
        base-url: ${LYRICS_API_URL:your_lyrics_api_url}
      wiktionary:
        base-url: https://en.wiktionary.org/api/rest_v1
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
logging:
  level:
    org.springframework.ai.chat.client.advisor: debug

kingfisher:
  secret-key: ${KINGFISHER_SECRET_KEY}
