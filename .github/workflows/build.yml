name: build

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Maven run package
        run: |
          chmod +x mvnw
          ./mvnw package
